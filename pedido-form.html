<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido de aluguel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/pedido-form.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <h1 class="h3 mb-3" id="titulo-pagina">Novo pedido de aluguel</h1>
    <div id="alertas"></div>

    <form id="form-pedido" class="needs-validation" novalidate>
      <div class="row g-3">
        <div class="col-md-6">
          <label for="automovelId" class="form-label">Automóvel</label>
          <select class="form-select" id="automovelId" name="automovelId" required>
            <option value="">Selecione...</option>
          </select>
          <div class="invalid-feedback">Escolha um automóvel.</div>
        </div>
        <div class="col-md-3">
          <label for="dataInicio" class="form-label">Início</label>
          <input type="date" class="form-control" id="dataInicio" name="dataInicio" required>
          <div class="invalid-feedback">Informe a data de início.</div>
        </div>
        <div class="col-md-3">
          <label for="dataFim" class="form-label">Fim</label>
          <input type="date" class="form-control" id="dataFim" name="dataFim" required>
          <div class="invalid-feedback">Informe a data de fim.</div>
        </div>

        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="contratoCredito" name="contratoCredito">
            <label class="form-check-label" for="contratoCredito">
              Quero associar um contrato de crédito a este aluguel
            </label>
          </div>
        </div>
        <div class="col-md-6 d-none" id="grupo-banco">
          <label for="bancoId" class="form-label">Banco para o crédito</label>
          <select class="form-select" id="bancoId" name="bancoId">
            <option value="">Selecione...</option>
          </select>
          <div class="invalid-feedback">Escolha o banco.</div>
        </div>

        <div class="col-12">
          <label for="observacoes" class="form-label">Observações (opcional)</label>
          <textarea class="form-control" id="observacoes" name="observacoes" rows="3"></textarea>
          <div id="resumo-valor" class="resumo-valor" aria-live="polite">
            <p class="mb-0 text-muted">Selecione o carro e as datas para ver o valor do aluguel.</p>
          </div>
        </div>
      </div>

      <div class="mt-4">
        <button type="submit" class="btn btn-primary">Salvar pedido</button>
        <a href="pedidos.html" class="btn btn-outline-secondary">Voltar</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/pedido-form.js"></script>
</body>
</html>
