<!DOCTYPE html>
<html lang="pt-BR"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <h1 class="h3 mb-3" id="titulo-pagina">Cadastro de cliente</h1>
    <div id="alertas"></div>

    <form id="form-cliente" class="needs-validation" novalidate>

      <h2 class="h5">Dados pessoais</h2>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="nome" class="form-label">Nome completo</label>
          <input type="text" class="form-control" id="nome" name="nome" required>
          <div class="invalid-feedback">Informe o nome.</div>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">E-mail (será seu login)</label>
          <input type="email" class="form-control" id="email" name="email" required>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>
        <div class="col-md-4">
          <label for="rg" class="form-label">RG</label>
          <input type="text" class="form-control" id="rg" name="rg" required>
          <div class="invalid-feedback">Informe o RG.</div>
        </div>
        <div class="col-md-4">
          <label for="cpf" class="form-label">CPF</label>
          <input type="text" class="form-control" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required>
          <div class="invalid-feedback">Informe um CPF válido.</div>
        </div>
        <div class="col-md-4">
          <label for="profissao" class="form-label">Profissão</label>
          <input type="text" class="form-control" id="profissao" name="profissao" required>
          <div class="invalid-feedback">Informe a profissão.</div>
        </div>
        <div class="col-12">
          <label for="endereco" class="form-label">Endereço</label>
          <input type="text" class="form-control" id="endereco" name="endereco" required>
          <div class="invalid-feedback">Informe o endereço.</div>
        </div>
        <div class="col-md-6">
          <label for="senha" class="form-label" id="rotulo-senha">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" minlength="6" required>
          <div class="invalid-feedback">A senha precisa de pelo menos 6 caracteres.</div>
        </div>
      </div>

      <h2 class="h5">Entidades empregadoras e rendimentos (máximo 3)</h2>
      <p class="text-muted small">Preencha só as que existirem.</p>
      <div id="rendimentos" class="mb-4"></div>

      <button type="submit" class="btn btn-primary" id="salvar">Salvar</button>
      <a href="index.html" class="btn btn-outline-secondary" id="btn-voltar">Voltar</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/cadastro.js"></script>
</body>
</html>
