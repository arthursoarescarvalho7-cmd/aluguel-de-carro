<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carros disponíveis - SuaLocadora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/carros.css">
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4">
    <form id="form-filtro" class="barra-filtro row g-3 align-items-end" novalidate>
      <div class="col-md-4">
        <label for="categoria" class="form-label text-white">Tipo de carro</label>
        <select class="form-select" id="categoria" name="categoria">
          <option value="">Todos os tipos</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <label for="precoMin" class="form-label text-white">Preço mín. (R$/dia)</label>
        <input type="number" class="form-control" id="precoMin" name="precoMin" min="0" step="1" placeholder="0">
      </div>
      <div class="col-6 col-md-2">
        <label for="precoMax" class="form-label text-white">Preço máx. (R$/dia)</label>
        <input type="number" class="form-control" id="precoMax" name="precoMax" min="0" step="1" placeholder="sem limite">
      </div>
      <div class="col-md-4 d-flex gap-2">
        <button type="submit" class="btn btn-reservar flex-fill">Filtrar</button>
        <button type="button" id="btn-limpar" class="btn btn-outline-light">Limpar</button>
      </div>
    </form>

    <nav aria-label="breadcrumb" class="mt-3">
      <ol class="breadcrumb mb-2">
        <li class="breadcrumb-item"><a href="home.html">Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">Carros</li>
      </ol>
    </nav>
    <hr class="mt-0"> 

    <div class="d-flex justify-content-between align-items-end flex-wrap gap-2 mb-4">
      <h1 class="titulo-pagina">Carros disponíveis</h1>
      <p id="contador" class="texto-suave mb-0"></p>
    </div>

    <div id="alertas"></div>

    <div id="grade-carros" class="grade-carros"></div>

    <p id="mensagem-fim" class="text-center texto-suave my-4 d-none"></p>

    <div id="sentinela" aria-hidden="true"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/catalogo.js"></script>
</body>
</html>
